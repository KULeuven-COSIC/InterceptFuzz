[package]
name = "aflnet_libafl"
version = "0.1.0"
edition = "2024"

[dependencies]
libafl = "=0.15.2"
libafl_bolts = "=0.15.2"

# Utilities used in the fuzzer
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
ctrlc = "3.4"

# Stateful fuzzing components (third_party/, copied to /workspace/third_party in the image)
butterfly-fuzz = { path = "../../third_party/butterfly" }
netfuzzbench-common = { path = "../../third_party/netfuzzbench-common" }